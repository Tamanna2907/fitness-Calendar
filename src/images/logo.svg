<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for the main circle -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#be185d;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradient for the inner elements -->
    <linearGradient id="innerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fdf2f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fce7f3;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#be185d" flood-opacity="0.2"/>
    </filter>
    
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle with gradient -->
  <circle cx="100" cy="100" r="90" fill="url(#mainGradient)" filter="url(#shadow)"/>
  
  <!-- Inner decorative circle -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="url(#innerGradient)" stroke-width="2" opacity="0.6"/>
  
  <!-- Main flower/bloom symbol -->
  <g transform="translate(100,100)" filter="url(#glow)">
    <!-- Flower petals -->
    <g fill="url(#innerGradient)" stroke="#fdf2f8" stroke-width="1">
      <!-- Top petal -->
      <ellipse cx="0" cy="-25" rx="12" ry="20" transform="rotate(0)"/>
      <!-- Top-right petal -->
      <ellipse cx="18" cy="-18" rx="12" ry="20" transform="rotate(45)"/>
      <!-- Right petal -->
      <ellipse cx="25" cy="0" rx="12" ry="20" transform="rotate(90)"/>
      <!-- Bottom-right petal -->
      <ellipse cx="18" cy="18" rx="12" ry="20" transform="rotate(135)"/>
      <!-- Bottom petal -->
      <ellipse cx="0" cy="25" rx="12" ry="20" transform="rotate(180)"/>
      <!-- Bottom-left petal -->
      <ellipse cx="-18" cy="18" rx="12" ry="20" transform="rotate(225)"/>
      <!-- Left petal -->
      <ellipse cx="-25" cy="0" rx="12" ry="20" transform="rotate(270)"/>
      <!-- Top-left petal -->
      <ellipse cx="-18" cy="-18" rx="12" ry="20" transform="rotate(315)"/>
    </g>
    
    <!-- Center circle -->
    <circle cx="0" cy="0" r="15" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
    
    <!-- Inner center dot -->
    <circle cx="0" cy="0" r="6" fill="#ec4899"/>
    
    <!-- Small decorative dots around center -->
    <circle cx="0" cy="-8" r="1.5" fill="#be185d" opacity="0.7"/>
    <circle cx="6" cy="-4" r="1.5" fill="#be185d" opacity="0.7"/>
    <circle cx="6" cy="4" r="1.5" fill="#be185d" opacity="0.7"/>
    <circle cx="0" cy="8" r="1.5" fill="#be185d" opacity="0.7"/>
    <circle cx="-6" cy="4" r="1.5" fill="#be185d" opacity="0.7"/>
    <circle cx="-6" cy="-4" r="1.5" fill="#be185d" opacity="0.7"/>
  </g>
  
  <!-- Subtle calendar/tracking elements -->
  <g transform="translate(100,100)" opacity="0.3">
    <!-- Small tracking marks around the edge -->
    <g stroke="#fdf2f8" stroke-width="2" fill="none">
      <line x1="0" y1="-60" x2="0" y2="-55" transform="rotate(0)"/>
      <line x1="0" y1="-60" x2="0" y2="-57" transform="rotate(30)"/>
      <line x1="0" y1="-60" x2="0" y2="-55" transform="rotate(60)"/>
      <line x1="0" y1="-60" x2="0" y2="-55" transform="rotate(90)"/>
      <line x1="0" y1="-60" x2="0" y2="-57" transform="rotate(120)"/>
      <line x1="0" y1="-60" x2="0" y2="-55" transform="rotate(150)"/>
      <line x1="0" y1="-60" x2="0" y2="-55" transform="rotate(180)"/>
      <line x1="0" y1="-60" x2="0" y2="-57" transform="rotate(210)"/>
      <line x1="0" y1="-60" x2="0" y2="-55" transform="rotate(240)"/>
      <line x1="0" y1="-60" x2="0" y2="-55" transform="rotate(270)"/>
      <line x1="0" y1="-60" x2="0" y2="-57" transform="rotate(300)"/>
      <line x1="0" y1="-60" x2="0" y2="-55" transform="rotate(330)"/>
    </g>
  </g>
  
  <!-- Sparkles/stars for a magical touch -->
  <g fill="#fdf2f8" opacity="0.8">
    <polygon points="160,40 162,46 168,46 163,50 165,56 160,52 155,56 157,50 152,46 158,46" transform="scale(0.6)"/>
    <polygon points="40,160 42,166 48,166 43,170 45,176 40,172 35,176 37,170 32,166 38,166" transform="scale(0.5)"/>
    <polygon points="170,150 171,153 174,153 172,155 173,158 170,156 167,158 168,155 166,153 169,153" transform="scale(0.4)"/>
  </g>
</svg>